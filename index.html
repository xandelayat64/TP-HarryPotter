
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">

    <title>Wiki Harry Potter</title>
</head>

<body>

    <header class="header">
        <div class="header__right">
            <a href="index.html">
                <img src="./images/logo.png" alt="Logo Harry Potter">
            </a>
        </div>

        <div class="header__left">
            <h1>Wiki Harry Potter</h1>

            <button class="menu-toggle"
                    type="button"
                    aria-label="Ouvrir le menu">
                <img src="./images/menu.png" alt="">
            </button>

        </div>
    </header>

    <main>
        <section id="houses">
            <h2>HOUSES</h2>

            <div class="houses">
                <img src="./images/gryffindor.png"
                     alt="Gryffindor"
                     title="Gryffondor">

                <img src="./images/hufflepuff.png"
                     alt="Hufflepuff"
                     title="Poufsouffle">

                <img src="./images/ravenclaw.png"
                     alt="Ravenclaw"
                     title="Serdaigle">

                <img src="./images/slytherin.png"
                     alt="Slytherin"
                     title="Serpentard">
            </div>
        </section>

        <section id="characters">
            <h2>CHARACTERS</h2>

            <div class="characters" id="characters-list">
                <p>Persos</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Wiki Harry Potter</p>
    </footer>

    <script src="./script.js"></script>

</body>
</html>
